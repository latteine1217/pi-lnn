# configs/exp_240_a_b0_les_T50.toml
# What: EXP-240_a — B0 (vanilla DeepONet) + LES_T50 stat-converged placement。
#       Architecture × placement 2D ablation 補完 B0 row（cf. v2 log [INDEX]）。
#
# Why: 已有 (B3, DNS), (B3, LES_T50), (B3, Random), (B0, DNS) 四點；缺 (B0, LES_T50)。
#      若 B0 + LES_T50 ≈ B0 + DNS (~18%) → LES placement 改善僅 B3 受益；
#      若 B0 + LES_T50 < B0 + DNS by ≈ 3pp (gap 同 B3) → LES placement 跨 architecture 有效。
#
# Hypothesis:
#   LES placement quality 跨 architecture transferable（spatial coherence 與架構無關）。
#   預期 B0 + LES_T50 ≈ B0 + DNS - 1~3pp ≈ 15-17%（vs B3+LES 12.36% 仍差 ~3-5pp 來自 architecture effect）。
#
# Falsifiability (per v2 log paper claim 2 strengthening):
#   (a) KE ≤ 16% → LES placement effect 跨 architecture 仍有效（gap 0-3pp 與 B3 受益等價）
#   (b) 16-22% → LES placement effect 削弱但仍存在
#   (c) > 22% → LES placement 改善僅 B3 專屬，跨 architecture 不 transferable
#
# 唯一改動（vs EXP-088 / EXP-201_a）:
#   - sensor_jsons / sensor_npzs 改用 LES_N256 T=50 stat-converged QR-pivot（EXP-221 同 sensor）
#   - artifacts_dir 標 exp240_a
#   - seed = 42 對齊 EXP-201_a baseline（B0 multi-seed 主 seed）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-088 / EXP-201_a 完全一致（B0 = vanilla DeepONet, no CfC, no cross-attn）
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 4-task GradNorm（含 cont）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

# AL-continuity 設定（同 EXP-088）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-re10000-exp240a-b0-les-T50"

# B0 = Vanilla DeepONet (no CfC, no cross-attention)
# 與 EXP-088 / EXP-201_a 完全相同的 B0 設定
use_vanilla_deeponet = true
vanilla_deeponet_K_sensors = 100
vanilla_deeponet_num_branch_layers = 3
vanilla_deeponet_num_trunk_layers = 3
