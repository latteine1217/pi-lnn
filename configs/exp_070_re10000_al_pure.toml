# configs/exp_070_re10000_al_pure.toml
# What: EXP-070 — Pure Augmented Lagrangian on continuity（無 GradNorm）。
#
# Why: 將 continuity 約束從 GradNorm balancing 升格為 dynamic penalty schedule
#      （spec v4 §2/§3）。EXP-070 為「pure AL」對照組，回答：
#      AL 本身能否獨立把 div L2 從 0.184 降到 < 0.05？
#
# 唯一改動（vs EXP-064）：
#   - use_gradnorm = false（手動固定 ns 權重）
#   - use_sensor_physics = false（AL v1 強制：避免 l_cont_total = sum-of-two-means）
#   - continuity_weight = 0.0（必由 0；AL 接管 cont penalty）
#   - use_augmented_lagrangian = true + 6 個 al_* 參數
#
# Hypothesis: div_L2 < 0.05；KE relative error ≤ 9% (允許 trade-off)
# Falsifiability: div_L2 連續 1000 steps 上升 → AL ρ 太大或 lambda_clip 太低
#
# physics_loss_weight = 0.057：從 EXP-064 (artifacts/.../exp064-sensor-physics) step 10000
# GradNorm 收斂值取得，w_ns_u=0.0583, w_ns_v=0.0560 → 平均 0.057。
# 因為 EXP-070 用 l_total = phys_weight · (l_ns_u + l_ns_v)（合併單一權重），
# 對應 EXP-064 的 w_ns_u·l_ns_u + w_ns_v·l_ns_v ≈ 0.057·(l_ns_u + l_ns_v)。
#
# Spec ref: docs/superpowers/specs/2026-05-04-al-continuity-design.md §7 EXP-070

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057   # 來自 EXP-064 step 10000 GradNorm 收斂：mean(w_ns_u, w_ns_v) ≈ 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0       # AL 接管，必為 0（_validate_al_config 會 assert）
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# Pure AL: GradNorm off
use_gradnorm = false
# AL-continuity 設定（spec v4 §3）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 1.0
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false   # AL v1 強制 false（spec §4 pre-condition assert）

artifacts_dir = "artifacts/deeponet-cfc-re10000-exp070-al-pure"
