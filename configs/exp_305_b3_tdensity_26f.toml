# configs/exp_305_b3_tdensity_26f.toml
# What: EXP-305 — 軸 A（時間取樣密度）ablation，B3 + LES_T50 sensor，26 frames（Δt=0.2, T=5）。
# Why: 主線用 201 frames（Δt=0.025）——此數字是 DNS 儲存 cadence 的副產品，從未被實驗檢驗。
#      本 sweep 固定窗長 [0,5]，只改 sensor 時間監督密度，量重建品質對取樣密度的敏感度。
#
# Hypothesis: 低頻重建品質對時間密度存在飽和點；Δt 過大時 sensor 時序 alias → KE / rel-L2 退化。
# Expected change: KE rel-err 與 velocity rel-L2 隨 frame 數下降呈「平台→崖」。
# Falsifiability: 若 26f 與 201f（EXP-245）在 multi-seed 雜訊帶內無差 → 該密度為過取樣。
#
# 派生 from EXP-245（201f baseline），唯一改動:
#   - sensor_jsons / sensor_npzs → tsub8（時間軸 stride=8 子取樣，26 frames）
#   - artifacts_dir → exp305
#   - dns_paths / T_total / 架構 / optimizer / loss 權重 全部與 EXP-245 相同（單變數 ablation）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_tsub8.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_tsub8_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
time_marching_warmup_steps = 2000   # fixed-step, 不隨 iterations 變動
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 20000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp305-b3-tdensity-26f-20k"
