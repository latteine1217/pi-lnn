# configs/exp_253_learn_kf.toml
# What: EXP-253 (task 1) — 學 forcing wavenumber k_f，A 已知 (=0.1)
#
# Why: 工程場景：force 大小已知（量測過 thrust），但波長配置未知（geometry 不明）。
#      k_f 在 sin 內非線性 entering，識別難度高於 A。
#
# Hypothesis: sigmoid bound [1, 8] 提供 well-conditioned search。init=4 對應 sigmoid raw ≈ 0.43，
#             距離真值 k_f=2 有 2×。若可識別：k_f_learned 收斂到 1.95-2.05，KE rel-err 7-12%.
#
# Falsifiability:
#   (a) k_f 收斂 1.95-2.05 + KE 7-12% → 非線性 identifiability OK
#   (b) k_f 收斂偶倍頻 4.0 或半倍頻 1.0 → 多解問題（PDE residual 對 k_f 多模）
#   (c) k_f 卡邊界 1.0 或 8.0 → sigmoid bound 過緊或 gradient 斷
#
# 對標 EXP-252 baseline (全知 forcing) 看 learn k_f 對 KE 的 cost.
#
# 設定對齊 EXP-252（option C 工程可遷移版）唯一改動 forcing flag + init.

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0          # 真值（僅 metric 對照用）
kolmogorov_A = 0.1            # 真值（不學）

# Learn k_f only
learn_forcing_A = false
learn_forcing_k_f = true
forcing_A_init = 0.1          # 與 truth 對齊
forcing_k_f_init = 4.0        # 2× truth, 刻意偏離
forcing_k_f_min = 1.0
forcing_k_f_max = 8.0

iterations = 10000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp253-learn-kf"
