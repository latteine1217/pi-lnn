# configs/exp_241_a_collo256.toml
# What: EXP-241_a — EXP-200_a (= legacy EXP-080, B3 + AL ρ=0.1) + num_physics_points 64→256（4×）。
#       Collocation density 對 KE / div 影響的 saturation 探索 first point。
#
# Why: EXP-200 multi-seed 主線 num_physics_points=64 在 RTX 3090 上 GPU util 僅 13-34 %（latency-bound）。
#      增加 collocation 可同時：
#      (1) 提供更密集的 physics residual 估計，可能改善 div / NS residual
#      (2) 提升 GPU 利用率（more compute per kernel）
#      (3) 測試 K=100 sensor + physics constraint 設定下 collocation density 是否為 binding constraint
#
# Hypothesis:
#   若 collocation 是 binding constraint → KE 進一步下降（< 10.68 %）+ div 改善
#   若 K=100 sensor 信息量為 ceiling → 4× collocation 無明顯改善（KE ≈ EXP-200_a 10.68 %）
#
# Falsifiability:
#   (a) KE ≤ 9.5 % → collocation density 為主要 bottleneck，主線應升級為 256
#   (b) KE ∈ [9.5, 11.5] % → marginal 或 noise level（與 multi-seed std 0.52 % 同量級）
#   (c) KE > 11.5 % → 反而退步（GradNorm/AL 對 collocation density 敏感，需調 weight init）
#
# 唯一改動（vs EXP-200_a / legacy EXP-080）:
#   - num_physics_points = 256（baseline 64）
#   - artifacts_dir 標 exp241a
#   - 其餘 recipe 完全不變（B3, seed=42, AL ρ=0.1, 4-task GradNorm, 10k steps）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-200_a / legacy EXP-080 完全一致（B3 = full architecture）
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 256        # CHANGED: 64 → 256（4×）
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 4-task GradNorm（同 EXP-080 recipe）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

# AL-continuity（同 EXP-080 recipe, ρ=0.1）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp241a-collo256"
