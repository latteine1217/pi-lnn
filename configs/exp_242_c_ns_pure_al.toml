# configs/exp_242_c_ns_pure_al.toml
# What: EXP-242_c — EXP-242_b 派生：NS_u/v 從 GradNorm 拿出（NS 純 AL, cont 維持雙開）。
#
# Why: EXP-242_b 是 NS+cont 都 GN+AL 雙開。EXP-242_c 拿掉 NS in GN，純 AL 接管。
#      測試「NS 純 AL」是否比「NS GN+AL 雙開」更乾淨/更好。
#
# Hypothesis:
#   GradNorm 動態調 weight 跟 AL dual ascent 可能互相干擾（§4 禁令的原始理由）。
#   若 NS 純 AL 顯著 > NS 雙開, §4 禁令對 NS 仍合理；若 ≈, 雙開無害。
#
# Falsifiability:
#   (a) KE < EXP-242_b → 純 AL 對 NS 更乾淨
#   (b) KE ≈ EXP-242_b → 雙開無害（§4 對 NS 過於保守）
#   (c) KE > EXP-242_b → GradNorm 對 NS 有實質貢獻（純 AL 缺 task balancing）
#
# 唯一改動（vs EXP-242_b）:
#   - gradnorm_tasks 移除 ns_u, ns_v → ["data", "cont"]
#   - gradnorm_init_weights 對應 → [1.0, 0.01]
#   - al_allow_ns_in_gradnorm = false（NS 不在 GN, 默認）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "cont"]                          # CHANGED: 移除 NS
gradnorm_init_weights = [1.0, 0.01]                        # CHANGED
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["ns_u", "ns_v", "cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true                            # cont 仍雙開
al_allow_ns_in_gradnorm = false                             # CHANGED: NS 已不在 GN, 不需 escape hatch

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp242c-ns-pure-al"
