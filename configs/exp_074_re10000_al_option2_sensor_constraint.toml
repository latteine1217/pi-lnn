# configs/exp_074_re10000_al_option2_sensor_constraint.toml
# What: EXP-074 — AL Option 2 (spec v5)：AL constraint 從 sensor 位置 cont² 計算。
#
# Why: 五輪實驗（EXP-064 baseline + EXP-070/070b/072/073）證實：
#        use_sensor_physics=true 是 EXP-064 場品質保住的核心，
#        而非 GradNorm balancing / AL 強度等選擇。
#
#      EXP-073 diagnostic（EXP-064 完全相同 - 只關 use_sensor_physics）也崩潰
#      到完全相同的失敗模式，證實 K=100 sensor 位置（cond≈11 for k≤16）
#      是必要的 well-conditioned constraint 點。
#
# Option 2 設計：
#   1. AL constraint C = mean(cont²) at sensor positions only（well-conditioned）
#   2. random colloc 仍計算 ns_u/ns_v/cont 殘差（給 ns 任務、cont 不入 loss）
#   3. l_total = data + phys_w·(l_ns_u + l_ns_v) + AL.loss_term(l_cont_sensor)
#   4. AL dual update 用 l_cont_sensor（與 al_term C 一致）
#
# 與 EXP-070b 差異：
#   - use_sensor_physics: false → true（必須）
#   - AL constraint 改用 sensor cont² 而非 random cont²
#
# 配置（沿用 EXP-070b v3 的 clip 縮限策略）：
#   - al_lambda_clip = 0.05 (cap λ at EXP-064 w_cont 量級)
#   - al_rho = 0.1 (適中 ramp)
#   - checkpoint_period = 5000 (磁碟安全)
#
# Hypothesis: div_L2 < 0.10（well-conditioned 點壓 div 比 random colloc 有效），
#             u/v RMSE ≤ 1.3× baseline（場品質保住）
#
# Falsifiability:
#   - 若仍崩 → AL 機制本身與 sensor_physics 共存有更深問題
#   - 若 div 不降但 RMSE 改善 → AL 強度太弱（試 ρ=0.3 或 clip=0.1）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064/070 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057   # 來自 EXP-064 step 10000 GradNorm 收斂值（mean w_ns）
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0       # AL 接管 cont
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# Pure AL: GradNorm off
use_gradnorm = false

# AL Option 2 setup
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 0.05         # cap at EXP-064 w_cont 量級
al_ema_momentum = 0.5

checkpoint_period = 5000
seed = 42
device = "mps"

# v5 Option 2 必須開（AL constraint 從這裡來）
use_sensor_physics = true
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 0     # 從第一步就用（vs EXP-064 的 1000 — AL 需要早期信號）

artifacts_dir = "artifacts/deeponet-cfc-re10000-exp074-al-option2-sensor-constraint"
