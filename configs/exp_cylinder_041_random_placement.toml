# configs/exp_cylinder_041_random_placement.toml
# CEXP-041 = CEXP-002 + random sensor placement（唯一變數：QR-pivot → random seed=42）
#
# 設計目的（直接測 Finding #8）：
#   所有 hard/soft/embedding body BC 失敗都歸因 Finding #8「body 區無 sensor 校正」。
#   但 QR-pivot sensor 全集中 wake（x>0.10），body 周圍/上游空白。
#   Random placement 全域分散 → upstream 1→19, near-inlet 0→18, near-body 7→11。
#   若 Finding #8 對，random（覆蓋 body 周圍）應改善，即使資訊效率比 QR 差。
#
# Falsifiability：
#   random < 3.54% → ✅ 空間覆蓋 > 資訊效率，Finding #8 強確認，解法是 placement 非架構
#   random ≈ 3.54% → 🟡 placement 不是關鍵
#   random > 10%   → ❌ QR 資訊效率才是關鍵，body 覆蓋沒那麼重要
#
[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_random_K100_cylinder_Re10031_seed42.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_random_K100_cylinder_Re10031_seed42_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 EXP-001 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow BC loss（新增）
bc_loss_weight = 0.1      # 固定權重，與 GradNorm 分離
bc_inflow_u = 0.33        # 從 DNS 量測的來流 u（m/s）
bc_n_points = 64          # inflow (x=0) 採樣 64 個 (y, t) 點
bc_body_n_points = 64     # cylinder body no-slip：u=v=0
bc_slip_n_points = 32     # top/bottom slip (y=0,1)：v=0；32=兩側各 16 點

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# Time marching
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer
iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp041-random-placement"
