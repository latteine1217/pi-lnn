# configs/exp_cylinder_021_trunk_sdf_hard_bc.toml
# CEXP-021 = Stage 3: trunk SDF input + hard BC gate 協同（雙機制）
#
# 設計目的：
#   CEXP-020 (SDF trunk input only, KE 405%) 失敗：SDF input 告訴 trunk「你在哪」，
#   但沒有 zero-velocity prior → adversarial signal → data fit 4× 惡化。
#   CEXP-016 (hard BC only, KE 111%) 失敗：trunk 不知道幾何位置 → NN_u 在 body
#   附近仍然大 → gate 壓掉 → over-compensation → GradNorm pathology。
#
#   本實驗：兩個機制協同：
#   1. SDF trunk input：query = [x, y, t, c, φ]，trunk 學「φ≈0 → NN_u 小」
#   2. Hard BC gate：u = clamp(φ/scale, 0,1) · NN_u，確保 body 內 u=v=0
#
#   協同機制：trunk 看到 φ → 主動學 near-body suppression
#            → gate 再次強制 → 兩者梯度方向一致 → GradNorm 不爆
#
# 與 CEXP-020 唯一差異：
#   use_hard_body_bc: false → true   (hard BC gate ON)
#   (use_body_distance_feature=true 維持)
#
# Falsifiability gates:
#   KE < 10%   → ✅ 雙機制協同成功：geometry-aware trunk + hard BC 是 working setup
#   KE 10-30%  → 🟡 partial; 考慮 GradNorm 調整或 iter 增加
#   KE > 30%   → ❌ 協同也不夠; 需要 Option E (cross-attn geometry tokens)
#
# 啟動條件與狀態追蹤：見 docs/cylinder_log_v2.md CEXP-021 entry

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉

# ===== Stage 2 Option A 唯一變動 =====
use_body_distance_feature = true   # trunk query_in += φ raw scalar (geometry awareness)

# ===== Stage 3 唯一變動（vs CEXP-020）=====
use_hard_body_bc = true            # hard BC gate ON：u = clamp(φ/scale, 0,1) · NN_u
# ==========================================
# ====================================

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 EXP-001 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow BC loss（新增）
bc_loss_weight = 0.1      # 固定權重，與 GradNorm 分離
bc_inflow_u = 0.33        # 從 DNS 量測的來流 u（m/s）
bc_n_points = 64          # inflow (x=0) 採樣 64 個 (y, t) 點
bc_body_n_points = 64     # cylinder body no-slip：u=v=0
bc_slip_n_points = 32     # top/bottom slip (y=0,1)：v=0；32=兩側各 16 點

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# Time marching
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer
iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "mps"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp021-trunk-sdf-hard-bc"
