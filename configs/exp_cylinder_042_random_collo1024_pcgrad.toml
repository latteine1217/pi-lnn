# configs/exp_cylinder_042_random_collo1024_pcgrad.toml
# CEXP-042 = CEXP-041 + num_physics_points 64→1024 + PCGrad on
#
# 設計目的：
#   在 CEXP-041（random placement, KE 251%）基礎上測「密集 collocation + PCGrad
#   gradient surgery」是否能壓低 over-energy。
#   PCGrad 走 GradNorm-weighted 主路徑（use_gradnorm=true 已開、無 AL）。
#
# [RISK] 預期方向偏負：
#   - CEXP-030 已證 K=100 + collo 1024 → KE 610%（physics over-constrain，sensor 資訊撐不起密集 collocation）。
#   - CEXP-041 random base 已 251%（random sensor 對 wake modes 覆蓋稀疏）。
#   - PCGrad 解 task 間梯度衝突，不解 sensor 資訊量不足；無理由預期逆轉 ill-posedness。
#
# Falsifiability：
#   KE < 251%      → PCGrad+collo 對 random base 有實質壓制效果（出乎預期）
#   KE ≈ 251%      → collo+PCGrad NEUTRAL（與 Kolmogorov pcgrad_neutral 一致）
#   KE > 251%      → collo 1024 加劇 ill-posedness（與 CEXP-030 一致，確認 sensor 資訊才是瓶頸）
#
[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_random_K100_cylinder_Re10031_seed42.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_random_K100_cylinder_Re10031_seed42_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 EXP-001 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow BC loss（新增）
bc_loss_weight = 0.1      # 固定權重，與 GradNorm 分離
bc_inflow_u = 0.33        # 從 DNS 量測的來流 u（m/s）
bc_n_points = 64          # inflow (x=0) 採樣 64 個 (y, t) 點
bc_body_n_points = 64     # cylinder body no-slip：u=v=0
bc_slip_n_points = 32     # top/bottom slip (y=0,1)：v=0；32=兩側各 16 點

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# PCGrad（本次新增變因）：GradNorm-weighted 2-group gradient surgery（data vs physics）
use_pcgrad = true

# Time marching
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer
iterations = 10000
num_physics_points = 1024     # 本次新增變因：64 → 1024（密集 collocation）
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp042-random-collo1024-pcgrad"
