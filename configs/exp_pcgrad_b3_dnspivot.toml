# configs/exp_pcgrad_b3_dnspivot.toml
# What: PCGrad 2-group 對稱 gradient surgery 探索性 ablation。基底 = EXP-094
#       (B3, 4-task GradNorm + AL, DNS-pivot K=100, KE 9.4% baseline)。
#
# Why: cosine 診斷（EXP-cosdiag, job 3748）顯示 data/physics 梯度 mean cos≈0、
#      僅偶發 cos<0（min −0.33）。標準 PCGrad 動機（持續衝突）不成立，故本實驗
#      定位為「偶發投影」探索性 ablation，非預期 KE 改善手段。
#
# 唯一改動（vs EXP-094）：
#   - use_pcgrad = true（取代 l_total.backward；data vs physics 兩組對稱投影）
#   - cosine_diag_freq = 50（續記 cosine 供對照；pc_cos 另由 PCGrad 每步輸出）
#   - artifacts_dir 改名
#
# Decision gate（vs EXP-094 KE 9.4%）：
#   KE ≤ 9.4% 且 L_data 不退步 → PCGrad 中性或微正，可保留為 optional
#   KE 顯著退步 / L_data 上升   → 投影削到 sensor 監督，PCGrad 在此場景有害，棄用
#   訓練不穩 / NaN              → 投影與 SOAP/AL 交互問題，需 debug 或棄用

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-094 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 4-task GradNorm（含 cont，由 al_allow_cont_in_gradnorm 啟用）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

# AL-continuity 設定（同 EXP-094）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

# === PCGrad 2-group 對稱 gradient surgery（本 run 唯一機制改動）===
use_pcgrad = true
cosine_diag_freq = 50

checkpoint_period = 500
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/exp_pcgrad_b3_dnspivot"

seed = 2
