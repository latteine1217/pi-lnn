# configs/exp_072_re10000_poisson_control.toml
# What: EXP-072 — Pressure Poisson 對照組（無 AL）。
#
# Why: 對照 EXP-070/071（AL on continuity），驗證「壓 p 結構」（Poisson）
#      vs「壓 ∇·u」（AL）哪個對 div_L2 更有效。
#      兩者都是處理「壓力—速度耦合不夠」的問題：
#      - Poisson: ∇²p = -[(∂_x u)² + (∂_y v)² + 2(∂_y u)(∂_x v)]，從 p 端壓
#      - AL-cont: λC + ρ/2·C²，從 u 端壓
#
# 唯一改動（vs EXP-064）：
#   - poisson_loss_weight = 0.1（啟用 Poisson）
#   - gradnorm_tasks = ["data","ns_u","ns_v","cont","poisson"]（5 元素含 poisson）
#   - gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.001]（poisson 起始較小）
#
# 注意（spec §7 Pressure Poisson 限制）：
#   Poisson RHS 推導時假設 ∇·u = 0 已成立。當前 baseline div_L2 ≈ 0.184，
#   此 RHS 準確度為 O(∇·u)；隨訓練 div 下降會自動修正。Early training 是
#   「近似方程」的 residual，paper 須說明。
#
# 注意（spec §7 cont 定義差異）：
#   EXP-072 保留 use_sensor_physics = true（EXP-064 既有），故 l_cont_total
#   是 random-collocation mean(cont²) + sensor 位置 mean(cont_sp²) 的和。
#   EXP-070/071 強制 use_sensor_physics = false → 只有 random colloc 單一 mean。
#   Paper 比較三組 div_L2 時必須註明 cont 定義差異。
#
# Hypothesis: div_L2 < 0.10（比 baseline 0.184 改善），但可能不及 AL（< 0.05）
# Falsifiability: 若 div_L2 ≥ AL 結果 → AL 在此 setup 確實是更直接的 div control
#
# Spec ref: docs/superpowers/specs/2026-05-04-al-continuity-design.md §7 EXP-072

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0       # 保留原邏輯（GradNorm 接管 cont task）
poisson_loss_weight = 0.1     # 啟用 Poisson

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 5-task GradNorm（含 poisson）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont", "poisson"]
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.001]

# AL: off（這是對照組）
use_augmented_lagrangian = false

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = true                # EXP-064 既有設定（spec §7 已標差異）
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

artifacts_dir = "artifacts/deeponet-cfc-re10000-exp072-poisson-control"
