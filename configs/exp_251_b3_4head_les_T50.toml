# configs/exp_251_b3_4head_les_T50.toml
# What: EXP-251 — EXP-244 + LES_T50 sensor（4-head + 1024 collo + 工程可遷移 placement）
#
# Why: EXP-244 (B3 + 4-head + 1024 collo + DNS) KE 5.51% 為 stable phase best, 但用 DNS oracle
#      sensor 違反「工程現場無 DNS」假設。EXP-251 把 EXP-244 的 4-head 延伸與 EXP-241_b 的
#      1024 collo 主線合併在 LES_T50 (EXP-221 sensor, stat-converged real-world DNS-free) 上,
#      測試「全部已知改善 lever 疊加 + 工程可遷移」配置。
#
# 對標:
#   - EXP-244 (B3 + 4-head + 1024 collo + DNS):    KE 5.51 %
#   - EXP-245 (B3 + 1-head + 1024 collo + LES_T50): KE 6.92 %
#   - EXP-241_b (B3 + 1-head + 1024 collo + DNS):   KE 5.97 %
#   預期 EXP-251 KE ~6.0-6.5 %（4-head -0.46pp + LES_T50 +0.95pp from DNS）
#
# Falsifiability:
#   (a) KE < 6.0 % → 4-head + LES_T50 全 lever 疊加完整加成
#   (b) KE 6.0-7.0 % → 各 lever 大致 additive
#   (c) KE > 7.0 % → 4-head 跟 LES_T50 互相 interfere
#
# 唯一改動（vs EXP-244 = stable/exp_244.toml）:
#   - sensor_jsons / sensor_npzs 改 LES_T50 (= EXP-221)
#   - artifacts_dir 標 exp251

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構同 EXP-244（B3 + 4-head, 1024 collo）
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
decoder_attention_heads = 4              # 4-head (同 EXP-244)
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 1024                # 1024 collo (同 EXP-244)
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp251-4head-les-T50"
