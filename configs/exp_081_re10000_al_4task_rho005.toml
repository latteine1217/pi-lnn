# configs/exp_079_re10000_al_4task_gradnorm.toml
# What: EXP-081 — EXP-080 + 再弱化 ρ→0.05 (2× weaker) — 找 KE-div trade-off sweet spot。
#
# Why: EXP-070~078 完整 AL ablation 顯示「兩全其美」不存在 — 不論 pure AL 或 AL+3-task GN，
#      div<0.05 必伴隨 KE 退步到 12-15%。EXP-064 baseline (4-task GN 含 cont, no AL) 是
#      best balance（KE 7.80%, div 0.184）。本實驗驗證若 AL 與 4-task GN cont 同時開，
#      是否能達 KE 7-9% + div < 0.10「兩全其美」。
#
# Hypothesis: ADR-001 §4 禁令過於保守。GN 動態調 cont weight + AL 套 dual penalty 在 same cont
#             可能形成補強而非衝突。
#
# Falsifiability:
#   (a) KE > 12% → §4 禁令合理（GN-AL conflict 真實，weight 與 dual variable 互相打亂）
#   (b) div > 0.30 → AL 被 GradNorm cont weight dynamic 打亂，無法 enforce constraint
#   (c) KE < 5% → 太完美需懷疑 instability / silent overfit
#   (d) KE 7-9% + div < 0.10 → §4 需修訂，找到「兩全其美」配方
#
# 唯一改動（vs EXP-064）：
#   - use_augmented_lagrangian = true + 標準 AL 設定
#   - al_allow_cont_in_gradnorm = true（明示 opt-in 違反 §4）
#   - continuity_weight = 0.0（AL 接管 dual penalty，但 cont 仍在 GradNorm task list）
#
# Spec ref: ADR-002 (重新審視 §4) — `docs/adr/002-al-continuity-post-bugfix-reopen.md`

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064 / EXP-071 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0       # AL 接管 dual penalty，但 cont 仍 in GradNorm task list
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 4-task GradNorm（含 cont，違反 ADR-001 §4 — 由 al_allow_cont_in_gradnorm 啟用）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]   # 同 EXP-064 baseline init
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0    # 不 cap，讓 GradNorm 自由動態調

# AL-continuity 設定（同 EXP-070 / EXP-071）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.05
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true    # ADR-001 §4 escape hatch（明示 opt-in）

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp081-al-4task-rho005"
