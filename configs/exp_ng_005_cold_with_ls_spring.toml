# configs/exp_ng_005_cold_with_ls_spring.toml
# What: Cold-start NG（無 Adam warmup）+ line search + SPRING momentum，
#       測試這兩個機制能否解決 NG003 cold-start 卡 5e-3 的死穴。
#
# 與 exp_ng_003 唯一差異：
#   ng_line_search    "none" → "backtracking"
#   ng_use_spring     False  → True
#   ng_spring_momentum (新)   = 0.9

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re1000/sensors_qrpivot_K100_N128_t0-5.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re1000/sensors_qrpivot_K100_N128_t0-5_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re1000_N128_T5_ds4.npy",
]
re_values = [1000.0]
observed_sensor_channels = ["u", "v"]

d_model = 64
d_time = 8
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 1
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 64
output_head_gain = 1.0
operator_rank = 64

data_loss_weight = 1.0
physics_loss_weight = 1.0
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0

num_query_points = 32
num_physics_points = 16

time_marching = false
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# === NG with line search + SPRING ===
lr_schedule = "ng"
learning_rate = 1.0
ng_damping = 1.0e-4
ng_damping_strategy = "lm"
ng_jacobi_scaling = true
ng_max_residuals = 2000
ng_solver_device = "cpu"
ng_resample_freq = 50
weight_decay = 0.0

# Line search
ng_line_search = "backtracking"
ng_ls_max_trials = 5
ng_ls_alpha_init = 1.0
ng_ls_alpha_decay = 0.5

# SPRING momentum
ng_use_spring = true
ng_spring_momentum = 0.9

iterations = 100
checkpoint_period = 0
seed = 42
device = "cpu"
artifacts_dir = "artifacts/exp_ng_005_cold_with_ls_spring"
