# configs/exp_244_multihead4_crossattn.toml
# What: EXP-244 — EXP-200_a 派生：cross-attention head 1 → 4。
#
# Why: EXP-200_a / EXP-241_b 用 single-head cross-attention。Multi-head reshape
#      不增 param count（純 inductive bias 細分：256 hidden dim 拆 4 個 64-dim head）
#      允許 attention 平行 attend 不同 spatial scales（low-k vs high-k features）。
#      legacy EXP-083 曾測 2-head 但落在 G_pivot falsified set（記在 v2 log Rejected #9）;
#      4-head 跟 2-head 屬不同 capacity 配置, 值得獨立驗證 — 但仍需注意「6-lever pivot
#      ablation 全 falsified」歷史結論可能適用。
#
# Hypothesis:
#   Multi-head reshape 不增 param 但提高 attention 表達力，預期 KE 可能 ↓ 0.5-2pp。
#   若 PINN 場景 single-head 已 saturated, multi-head 中性。
#
# Falsifiability:
#   (a) KE < 9.5 % → multi-head 4 為 net positive，可加 EXP-241_b (1024 collo) 疊加測
#   (b) KE 9.5-11.5 % → marginal/中性（同 EXP-200_a 1 std 內）
#   (c) KE > 11.5 % → multi-head splitting 削弱 single-head capacity（pivot ablation 結論延伸）
#
# 唯一改動（vs EXP-200_a = legacy EXP-080）:
#   - decoder_attention_heads = 4（baseline = 1）
#   - attn_head_dim = query_mlp_hidden_dim / heads = 256/4 = 64
#   - rel_bias/locality_decay 仍 shared across heads（per default decoder.py impl）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-200_a 一致 + decoder_attention_heads 改 4
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
decoder_attention_heads = 4              # CHANGED: 1 → 4（每 head 64 dim, param count 不變）
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true   # cont 雙開（同 baseline EXP-200_a）

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp244-multihead4-crossattn"
