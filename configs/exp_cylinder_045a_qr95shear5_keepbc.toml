# configs/exp_cylinder_045a_qr95shear5_keepbc.toml
# CEXP-045a: 95 QR wake + 5 body-ring shear sensor，保留 body BC（A/B 之 A）
#
# 來源：codex 辯論共識（Recommendation #2）——所有 geometry-awareness 嘗試都 over-energy，
#       根因是 wake 生成源（separation shear layer）從未被觀測。本實驗用 5 個 body-ring
#       最大剪切 sensor 直接觀測分離剪切層，補上缺失動態資訊。
#
# A/B 設計（CEXP-045a vs CEXP-045b）：唯一變因 = bc_body_n_points。
#   045a（本檔）：bc_body=64 保留 → 測「shear sensor + body BC 共存」（near-body 雙約束風險）
#   045b        ：bc_body=0  移除 → 測「shear sensor 能否取代 body BC」（CEXP-032 風險）
#
# Hypothesis: 觀測 separation shear layer 提供 wake 動態關鍵缺失資訊，把 over-energy
#             （ke_pred/ref 2–7×）拉回 ~1。
# Expected_Change: ke_pred/ref → ~1，ω RMSE 下降，wake phase 對齊。
# Falsifiability:
#   045a：若 KE 仍 >100% 且 ω 未改善 → shear sensor 與 body BC 在 near-body 雙約束衝突
#         （Finding #8），或 shear 資訊不足以解 over-energy。
#   對照 CEXP-002（純 QR + body BC，3.54%）：若 045a 退步，證明加 shear sensor（換掉 5 QR）
#         有害；若改善，證明 shear 觀測有獨立價值。
#
[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qr95shear5_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qr95shear5_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 CEXP-002 baseline 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow / body / slip BC loss
bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 64     # A/B 變因：045a 保留 body no-slip BC
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm（與 CEXP-002 相同）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# Time marching（與 CEXP-002 相同）
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer（與 CEXP-002 相同）
iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp045a-qr95shear5-keepbc"
