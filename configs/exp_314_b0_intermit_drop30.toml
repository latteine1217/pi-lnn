# configs/exp_314_b0_intermit_drop30.toml
# What: EXP-314 — 間斷 sensor（random dropout 30%）下的 B0 訓練。
# Why: 測 CfC（連續時間、per-step 真實 Δt 跨 gap 演化）vs vanilla DeepONet（branch 只吃
#      co-temporal snapshot → gap 時 zero-order-hold）。B3 與 B0 用同一 dropout mask（seed 0）對照。
#
# Hypothesis: gap 時刻 B3 重建優於 B0；dropout↑（gap↑）時 B0 相對退化加大。
# Falsifiability: 若 gap 時刻 B3≈B0（雜訊帶內）→ CfC 連續時間對此任務無實際優勢。
#
# 派生 from EXP-246 (B0)，唯一改動:
#   - sensor → drop30s0（時間軸隨機丟 30%，非等距）
#   - artifacts_dir → exp314
#   - 其餘（架構/optimizer/iterations/loss）逐字沿用 baseline，繼承其架構對公平性
# 評估用 scheme-B：query 落完整 DNS 201，按 retained/dropped 拆誤差（json.intermittent 記索引）。

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_drop30s0.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_drop30s0_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 10000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false
# B0 = Vanilla DeepONet
use_vanilla_deeponet = true
vanilla_deeponet_K_sensors = 100
vanilla_deeponet_num_branch_layers = 3
vanilla_deeponet_num_trunk_layers = 3
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp314-b0-intermit-drop30"
