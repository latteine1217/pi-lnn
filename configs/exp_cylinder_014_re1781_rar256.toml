# configs/exp_cylinder_014_re1781_rar256.toml
# What: cylinder_012/013 (Re=1781) collapse 診斷後第三次嘗試。
#       前兩次假設失敗（capacity 降 4× 仍 collapse；sensor 已在 wake 但 wake 信號被
#       小 collocation batch 稀釋）。
#
#       本次直接攻擊 batch SNR：collocation 64→256 + RAR adaptive sampling。
#
# Hypothesis（修正後）:
#   - 64 random collocation 中只 ~7 點落入 wake corridor → wake gradient
#     占 batch 僅 ~3% → 訓練「看不到收斂方向」
#   - 256 random + RAR pool (2560 candidates, top-by-residual) → 預期早期
#     ~150 wake points / batch (20× 信號放大)
#   - GradNorm 推 w_cont→82 是 *symptom*，不是 cause；batch SNR 修對後 cont
#     gradient 量級恢復正常，weights 不會飆
#
# Trap warning:
#   RAR 假設 NS residual 高 = 學不好。對 trivial 解 (u≡0.33) NS residual ≈ 0
#   ranking 失效退化成 random。預期訓練早期 random init 不是 trivial → RAR
#   仍能找 wake high-residual region → 早期就拉 model 脫離 trivial basin。
#
# 變更（vs cylinder_012）:
#   num_physics_points:               64 → 256       (4× batch)
#   physics_collocation_strategy:     body_aware → rar  (adaptive)
#   rar_update_freq:                  - → 50          (每 50 步 update pool)
#   rar_pool_multiplier:              - → 10          (pool=2560)
#   rar_exploration_ratio:            - → 0.2         (20% random 防 mode collapse)
#
# 保留 cylinder_012 的：full capacity (256d), hard BC, hybrid sensor, GradNorm 5-task

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_hybrid20qr80_K100_cylinder_Re1781.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_hybrid20qr80_K100_cylinder_Re1781_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00020-of-00092.arrow",
]
re_values = [1781.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 回到 cyl_012 的 full capacity（cyl_013 證明降容量沒救）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 96
bc_slip_n_points = 32
bc_outlet_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05

# === 核心改動：RAR adaptive sampling + 大 batch ===
physics_collocation_strategy = "rar"
rar_update_freq = 50           # 每 50 步重新評估 residual pool
# [RISK: KNOWN_PITFALLS — SOAP + rar_update_freq=50 觸發 EXP-053 失敗模式
#         （preconditioner 跟不上 collocation 變化，L_phys 爆漲）；穩定下限
#         ≥1000。此處刻意探索 cylinder collapse 邊界，需密切監控 L_phys 軌跡，
#         不適合直接 promote 為 baseline。]
rar_pool_multiplier = 10       # pool size = 256 × 10 = 2560 candidates
rar_exploration_ratio = 0.2    # 20% random 防 mode collapse / trivial trap

use_hard_body_bc = true

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.1]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 5000
num_physics_points = 256       # 64 → 256 (4×)
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "mps"

artifacts_dir = "artifacts/deeponet-cfc-cylinder-exp014-re1781-rar256"
