# configs/exp_256_force_from_zero.toml
# What: EXP-256 — 「force-from-zero」測試：A 跟 k_f 都從接近 0 開始學
#
# Why: EXP-253~255 forcing trajectory 顯示 gradient signal 弱 + A direction 錯
#      (從 0.05 drift 到 0.045 反方向)。本實驗從「物理 force ≈ 0」極端 init 開始,
#      測試 PI-CON inverse problem 能否從零 force 復原真值 (A=0.1, k_f=2.0)。
#
# 物理意義: force = A · sin(k_f · y), 當 A → 0 OR k_f → 0 時 force → 0.
#           本配置兩者都接近 0 → 訓練初期 NS 沒 forcing source term, model 必須
#           從 sensor data + cont residual 中「推論」forcing 真值。
#
# Implementation 限制處理:
#   - A 用 log parameterization, A > 0 永遠成立 → A_init = 0.001 (1% truth)
#   - k_f 用 sigmoid bound, strict (k_f_min < k_f_init < k_f_max)
#     → 放寬 k_f_min = 0.001 (從預設 1.0), k_f_init = 0.01 (close to 0)
#
# Hypothesis:
#   (a) 若 gradient signal 健康 → A 跟 k_f 各自往 truth 移動 (0.001→0.1, 0.01→2.0)
#       即使初始 force ≈ 0, NS residual 對 sensor data 的 mismatch 提供 strong signal
#   (b) 若 backbone 過度 compensate → model 學成「無 forcing 的解」, A 跟 k_f 停留接近 init
#   (c) 多解：A 跟 k_f scaling 互補 (A↑·k_f↓ 或 反之) 也能滿足 NS, 但跟 truth 不對
#
# Falsifiability:
#   - A_learned ∈ [0.08, 0.12] AND k_f_learned ∈ [1.8, 2.2] → identifiability OK (a)
#   - A_learned < 0.01 AND k_f_learned < 0.1 → backbone over-compensate (b)
#   - 其他組合 → 多解 (c)
#
# 唯一改動 vs EXP-255 (learn both, init A=0.05/k_f=4.0):
#   - forcing_A_init: 0.05 → 0.001 (1% of truth)
#   - forcing_k_f_init: 4.0 → 0.01 (close to 0)
#   - forcing_k_f_min: 1.0 → 0.001 (放寬 sigmoid lower bound)
#   - forcing_k_f_max: 8.0 → 8.0 (不變)

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0          # 真值（僅 metric 對照用）
kolmogorov_A = 0.1            # 真值（僅 metric 對照用）

# Learn both — 從接近 0 開始
learn_forcing_A = true
learn_forcing_k_f = true
forcing_A_init = 0.001        # 1% of truth, A → 0
forcing_k_f_init = 0.01       # 0.5% of truth, k_f → 0
forcing_k_f_min = 0.001       # 放寬下界（原 1.0）讓 k_f 可接近 0
forcing_k_f_max = 8.0

iterations = 10000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp256-force-from-zero"
