# configs/exp_273_b3_les_T50_40k.toml
# What: EXP-273 — EXP-245_a (KE 5.71±0.11%) 完全相同 config，僅 iterations 20k→40k。
# Why: EXP-245 metrics.jsonl 後段分析顯示 20k 尚未飽和（最後 5k 步 l_data -20.6%、
#      l_physics -32.6%），模型 undertrained。測「20k 是否只是早停」——延長至 40k 看 KE 是否再降。
#
# 設計（single-variable 延伸測試）:
#   - lr_decay_steps 維持 2000（不隨 iterations 拉長）→ step-decay 不依賴總步數，
#     ScheduleFree 也不需總步數 → 前 20k 軌跡與 EXP-245 完全相同，乾淨延伸。
#   - lr 在 40k 衰減到 1e-3·0.9^20 ≈ 1.22e-4（仍 >> min 1e-6），back-half 仍可學習。
#
# 派生 from EXP-245_a (configs/exp_245_b3_les_T50.toml), 唯一改動:
#   - iterations 20000 → 40000
#   - artifacts_dir → exp273
#   - device mps → cuda (lab-server r740)
#
# 判讀:
#   - KE < 5.71% 顯著 → 20k 低估了 PI-CON，baseline 數字需更新
#   - KE ≈ 5.71% → 20k 已達資訊上限，loss 續降只是 sensor overfit（亦為有價值 finding）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
time_marching_warmup_steps = 2000   # fixed-step, 不隨 iterations 變動
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 40000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
checkpoint_period = 1000
seed = 42
device = "cuda"
use_sensor_physics = false
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp273-b3-les-T50-40k"
