# configs/exp_071_re10000_al_gradnorm.toml
# What: EXP-071 — AL on continuity + 3-task GradNorm（data/ns_u/ns_v）。
#
# Why: 對照 EXP-070（pure AL），驗證 GradNorm 動態平衡 data/ns 三 task 的同時，
#      AL term 以 weight=1 加進 loss 是否與 EXP-070 結果一致。
#
# 設計關鍵（spec v4 §5 / §7）：
#   - AL term 完全在 GradNorm losses 之外（v4 修補 v3 mean_G 污染）
#   - gradnorm_tasks = ["data","ns_u","ns_v"]（3 元素，無 cont、無 al）
#   - GradNorm 看不到 G_al → λ jump 不會擾動 w_ns_u/w_ns_v
#
# 唯一改動（vs EXP-070）：
#   - use_gradnorm = true
#   - gradnorm_tasks = ["data","ns_u","ns_v"]
#   - gradnorm_init_weights = [1.0, 0.01, 0.01]（3 元素）
#
# Hypothesis: div_L2 ≈ EXP-070 ± 10%；KE 改善（data/ns 平衡更好）
# Falsifiability: 若 EXP-071 result 顯著差於 EXP-070 → GradNorm 與 AL 仍有耦合
#                 → 需檢視是否真的把 AL 排除在 _gradnorm_step 之外
#
# Spec ref: docs/superpowers/specs/2026-05-04-al-continuity-design.md §7 EXP-071

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057   # GradNorm 接管後不作為乘數；保留為 fallback（與 EXP-070 對齊）
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0       # AL 接管 cont
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 3-task GradNorm（cont 移出，AL 接管；spec v4 §5）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v"]
gradnorm_init_weights = [1.0, 0.057, 0.057]   # warm start at EXP-064 step-10k convergence
                                              # 避免 GradNorm 在前 ~5k 步重新爬升的 transient
                                              # 干擾 EXP-070 vs EXP-071 對照

# AL-continuity 設定（spec v4 §3）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 1.0
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/legacy/exp071-al-gradnorm"
