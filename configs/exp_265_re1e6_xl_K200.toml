# configs/exp_265_re1e6_xl_K200.toml
# What: EXP-265 — Re=10⁶ XL capacity (d_model=384) + 50k iter + K=200 LES sensor (Path A)
#       Build on EXP-264 (Re=1e6 + d_model 384 + 50k) 唯一改動: sensor K=100 → K=200
#
# Why: EXP-264 達 KE 19.02 % marginal case (b/c) 邊緣, 但 ω/Ens 改善有限 (information bound dominant).
#      K=100 對 Re=1e6 Nyquist k_max 5.64 vs inertial cut-off k≈100 → cover 5.6% spectral range only.
#      K=200 升 Nyquist k_max 5.64 → 7.98 (+41% bandwidth, cover 8% spectral range).
#      雖然絕對 coverage 仍 small, 但與 Re=1e4 K=100→200 (5.97 → 3.91 %, -34.5%) 同 scaling 預期能突破 case (a) 15%.
#
# Predicted KE rel-err:
#   - EXP-262 (Re=1e6, K=100, d=256, 10k):    23.73 %
#   - EXP-264 (Re=1e6, K=100, d=384, 50k):    19.02 %   (capacity + step effect)
#   - EXP-265 (Re=1e6, K=200, d=384, 50k):    13-16 %   (capacity + step + K-scaling)
#
# Falsifiability:
#   (a) KE ≤ 14 %        → K-scaling 對 Re=1e6 也 viable, 雙 lever (capacity + K) 突破 case (a) engineering threshold
#   (b) KE 14-17 %       → marginal 改善, 需 Path 3 (LES T=50 + K=200) 才能突破
#   (c) KE > 17 % stagnant→ K-scaling 對 Re=1e6 邊際遞減過大 (Nyquist+41% 仍不夠), 須加 K (K=400)
#
# 唯一改動 vs EXP-264 (= stable/exp_264.toml = exp_264_re1e6_xl_50k.toml):
#   - sensor_jsons / sensor_npzs 改 K=200 LES_T5 Re=1e6 (待生成於 2026-05-21)
#   - artifacts_dir 標 exp265

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re1000000/sensors_qrpivot_K200_N512_t0-5_si50_les_n512_T5.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re1000000/sensors_qrpivot_K200_N512_t0-5_si50_les_n512_T5_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_Re1e6_N512_T5_ds4.npy"]
re_values = [1000000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 384
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 384
output_head_gain = 1.0
operator_rank = 384
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
time_marching_warmup_steps = 2000
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 50000
num_physics_points = 512
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 5000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
checkpoint_period = 2500
seed = 42
device = "mps"
use_sensor_physics = false
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re1000000-exp265-xl-K200-50k"
