# configs/exp_269_les_K200_20k.toml
# What: EXP-269 — K-scaling EXP-256 (K=200, 10k single seed) 升 20k iter 對齊 EXP-245 baseline。
#       唯一改動 vs EXP-256：iterations 10k→20k，並顯式加 time_marching_warmup_steps=2000
#       防止 fraction-based warmup 隨 iterations 翻倍 (0.3 × 20000 = 6000 ≠ EXP-245 的 2000)。
#
# Why: plateau 分析 (loss tail-1000 step log10 slope) 顯示
#        K=100 EXP-245 (20k):  -1.78e-5/iter  (接近 plateau)
#        K=200 EXP-256 (10k):  -3.66e-5/iter  (顯著未 plateau)
#        K=400 EXP-257 (10k):  -2.98e-5/iter  (顯著未 plateau)
#      EXP-256/257 與 EXP-245 不公平：iter 差 2×。本實驗把 K=200 補到 20k 對齊。
#
# 對標:
#   - EXP-245 (K=100 LES_T50, 20k n=5):  KE 5.71 ± 0.11 %  (1024 collo)
#   - EXP-256 (K=200 LES_T50, 10k n=1):  KE 3.91 %         (1024 collo, 未 plateau)
#   - 預測 EXP-269 (K=200 LES_T50, 20k n=1): KE ≤ 3.5 %    (per K=100 10k→20k 觀察 loss 再降 ~55%)
#
# Falsifiability:
#   (a) KE ≤ 3.5 % AND tail-1000 slope > -1e-5/iter → plateau 達成，K-scaling 嚴格 fair vs EXP-245
#   (b) KE 3.5-3.9 % AND slope > -2e-5/iter → 接近 plateau，improvement marginal
#   (c) KE > 3.9 % OR slope < -3e-5/iter → 20k 仍不足，需更長 schedule
#
# 變更 vs EXP-256 (= exp_256_les_K200.toml):
#   - iterations 10000 → 20000
#   - time_marching_warmup_steps 0 (走 ratio 0.3=3000 step) → 2000 (對齊 EXP-245 fixed)
#   - artifacts_dir 標 exp269-les-K200-20k

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K200_N256_t0-5_si100_les_n256_T50standalone.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K200_N256_t0-5_si100_les_n256_T50standalone_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3                # legacy ratio key, 被下一行覆寫
time_marching_warmup_steps = 2000         # fixed-step, 不隨 iterations 變動（對齊 EXP-245）
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 20000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp269-les-K200-20k"
