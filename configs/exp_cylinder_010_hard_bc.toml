# configs/exp_cylinder_010_hard_bc.toml
# What: cylinder + Hard body BC（Sukumar 2022 風格 output transformation）
#       u = (φ/scale).clamp(0, 1) · NN_u
#       v = (φ/scale).clamp(0, 1) · NN_v
#       p = NN_p
#
# 與 exp_008 (distance-as-input, 5000 步) 差異：
#   use_body_distance_feature: true → false（移除 A）
#   use_hard_body_bc:          ——   → true  （加 B）
#
# Hypothesis: Hard BC 物理保證 body 內 u=v=0 (no-slip)，且 SDF 用 differentiable
#             torch ops，autograd 正確算 ∂u/∂x = ∂φ/∂x · NN + φ · ∂NN/∂x。
#             修了 distance-as-input 的 detach chain rule bug 後：
#             - div_L2 從 2.95 (exp_008) 顯著降到 < 1.5 (接近 exp_006 的 1.36)
#             - KE rel-err 從 33.6% 降到 < 13%
#             - wake structure 仍因 hard BC 約束改善

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# BC（與 exp_006/008 一致）
bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 96
bc_slip_n_points = 32
bc_outlet_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "body_aware"

# === Hard body BC（B：取代 distance-as-input） ===
use_hard_body_bc = true       # ← 啟用 output transformation
                              #    u, v ← (φ/scale).clamp(0,1) · NN
                              #    p 不 gate
                              # 物理保證 body 內 u=v=0（no-slip）

# GradNorm 5-task：讓 weights 自然動態，不加 floor。
# Distance-as-input detach bug 已修（改用 hard BC output transformation），
# 沒有 GradNorm pathology 需要 floor 補救。
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.1]
# gradnorm_min_weight = 0.0  (default, 不啟用 floor)

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 5000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "mps"

artifacts_dir = "artifacts/deeponet-cfc-cylinder-exp010-hard-bc"
