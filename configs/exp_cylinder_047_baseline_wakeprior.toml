# configs/exp_cylinder_047_baseline_wakeprior.toml
# CEXP-047: CEXP-002（working baseline, 3.54%）+ wake-amplitude prior（neutrality check）
#
# 來源：codex 辯論 Round 2 + CEXP-046 配套。CEXP-046 測「prior 能否 rescue over-energy」；
#       本檔測「prior 是否傷害已成功的 winner」。
#
# 設計（neutrality check）：base = CEXP-002（KE 3.54%, ke_pred/ref 1.01，能量已對）。
#       唯一變因 = 加 wake-amplitude prior（與 CEXP-046 完全相同 prior 超參）。
#       CEXP-002 能量已正確 → 單側上界 cap 預期不 binding → KE 應維持 ~3.54%。
#
# Hypothesis: 單側上界對「能量已正確」的解不 binding，不扭曲 winner。
# Expected_Change: KE ≈ 3.54%（中性）；若 prior 設計正確，cap 幾乎不觸發。
# Falsifiability: 若 KE 顯著退步（>10%）→ prior 上界太緊（γ 太小 / envelope 低估），
#       會壓掉真實 shedding peak → 證明 prior 不安全，需放寬 γ 或縮小 Ω_wake。
#
[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 CEXP-002 baseline 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow / body / slip BC loss（與 CEXP-002 相同）
bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 64
bc_slip_n_points = 32

# Wake-amplitude envelope prior（與 CEXP-046 完全相同超參）
wake_amplitude_prior_weight = 1e-3
wake_amplitude_gamma = 1.5
wake_amplitude_percentile = 0.95
wake_amplitude_radius_scale = 2.0
wake_amplitude_sigma_scale = 1.0
wake_amplitude_n_points = 256

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm（與 CEXP-002 相同）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# Time marching（與 CEXP-002 相同）
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer（與 CEXP-002 完全相同，collo=64）
iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp047-baseline-wakeprior"
