# configs/exp_242_b_ns_al_dual.toml
# What: EXP-242_b — EXP-200_a 派生：NS_u/v 也加 AL（同 cont 雙開）。
#
# Why: EXP-200_a 中 cont 雙開 (GN + AL)，但 NS_u/v 只在 GradNorm。本實驗測試
#      NS residual 加 AL dual penalty 是否提供 additional pressure 改善 NS satisfaction。
#
# Hypothesis:
#   AL dual penalty 對 NS_u/v residual 提供 additional pressure；λ_ns_u/v 增長後
#   會推 NS 收斂更深。可能 (a) KE ↓ 同時 div ↓（multi-AL 整體 enforce）或
#   (b) NS over-penalty 壓抑 data fit → KE ↑。
#
# Falsifiability:
#   (a) KE ≤ 9.5 % + L_phys ↓ → 確認 multi-constraint AL 為 net positive
#   (b) KE ∈ [9.5, 11.5] % + L_phys ↓ → NS AL 對 KE 中性, physics consistency 改善
#   (c) KE > 11.5 % → AL over-penalty data fit
#
# 唯一改動（vs EXP-200_a）:
#   - al_constraints = ["ns_u", "ns_v", "cont"]
#   - al_allow_ns_in_gradnorm = true（保留 NS 在 GN，與 cont 同雙開模式）

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]          # 同 EXP-200_a
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_constraints = ["ns_u", "ns_v", "cont"]                  # CHANGED: 加 NS
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
al_allow_ns_in_gradnorm = true                              # CHANGED: NS 雙開 opt-in

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp242b-ns-al-dual"
