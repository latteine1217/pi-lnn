# configs/exp_cylinder_007_distance.toml
# STATUS: BLOCKED on main — `use_body_distance_feature` key 沒落到 main 的
#         DEFAULT_LNN_ARGS / decoder。要實際跑此 config 須先在 src 端落地
#         distance feature；distance feature 主線已被 hard body BC（010+）取代。
#         保留此檔作為 hypothesis 紀錄；下方 D 區塊已 comment-out 以避免啟動 ValueError。
#
# What: cylinder K=100 + post-fix + 5-task GradNorm + B (BC lite) + C (body_aware sampling)
#       + **D (body_distance feature in query_decoder)** [BLOCKED, see STATUS above]
#
# 與 exp_006 差異：
#   use_body_distance_feature: false → true   (query 加 SDF input dim +1)
#
# Hypothesis: model 接到 SDF feature 後能自己學「離 body 多近 → 對應 boundary layer
#             結構」，cylinder body 邊緣的 sharp ∂u/∂y 終於有 capture 機會。
# Falsifiability: 若 KE rel-err 仍 ≥ 13%（exp_006 同步數），表示 distance feature
#                 對 single-pass 訓練沒貢獻，需要 hard BC（Sukumar 2022）或更長訓練。

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 96
bc_slip_n_points = 32
bc_outlet_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "body_aware"

# === D: Body-distance feature in query_decoder ===
# BLOCKED — key 不在 main 的 DEFAULT_LNN_ARGS。詳見檔頭 STATUS。
# use_body_distance_feature = true   # ← 新增 SDF 進 query input
#                                     # query_in: 28 → 29 (cylinder K=100 setup)
#                                     # ckpt 不相容 exp_002~006

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.1]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 3000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "mps"

artifacts_dir = "artifacts/deeponet-cfc-cylinder-exp007-distance"
