# configs/exp_cylinder_033_hybrid95down_no_bodybc.toml
# CEXP-033 = CEXP-031 (hybrid + no body BC) - 5 upstream sensors
#
# 診斷目的：
#   CEXP-031 (hybrid K=100, no body BC, KE 13.1%) 與 CEXP-002 (QR wake, KE 3.54%) 仍差 3.7×。
#   Hypothesis: 5 個 upstream sensor（x < body_x = 0.063）約束了 stagnation 區域的
#   representation，使 model 在 body 附近的速度場學習困難 → 剩餘 gap 的主因。
#
#   本實驗：移除 5 個 upstream sensor，只保留 95 個 downstream sensor（x ≥ 0.063）。
#   新 sensor file: sensors_hybrid95downstream_K95_cylinder_Re10031.{json,npz}
#
# 與 CEXP-031 差異：
#   sensor_jsons/npzs: hybrid K=100 → hybrid_95downstream K=95
#   (bc_body_n_points = 0 保持不變)
#
# Falsifiability gates：
#   KE ≈ 3.5%   → upstream sensor 是 13.1% gap 的主因；downstream-only hybrid ≈ QR wake
#   KE 5-10%    → 部分改善；wake coverage 稀疏（95 vs 100）也有貢獻
#   KE ≈ 13.1%  → upstream sensor 不是主因；gap 來自其他（coverage density 或其他）

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_hybrid95downstream_K95_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_hybrid95downstream_K95_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 0    # 衝突 실험에서 이미 확인됨（CEXP-031 과 동일）
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp033-hybrid95down-no-bodybc"
