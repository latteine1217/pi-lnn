# configs/exp_cylinder_036_rar.toml
# CEXP-036 = CEXP-002 + RAR (Residual-based Adaptive Refinement) collocation
#
# 設計目的：
#   CEXP-002 (random collo 64, KE 3.54%) 是 working baseline。
#   Finding #9: 盲目加 collo (CEXP-030, 1024) 因 sparse ill-posedness 崩潰 (610%)。
#   RAR 假設：不增加 collo *數量*，而是把固定 64 點「智慧地」放到高 residual 區
#   （wake 渦核 / 剪切層），讓 physics 約束聚焦在真正需要的位置，而非全場稀釋。
#
# 單一變數變動 vs CEXP-002：
#   physics_collocation_strategy: "random" → "rar"
#   （num_physics_points 維持 64；RAR pool = 64 × 10 = 640，從中選 top-residual）
#
# ⚠️ SOAP + RAR 相容性（CLAUDE.md KNOWN_PITFALLS, EXP-053/054 根因）：
#   RAR freq 過低（如預設 50）會持續重採樣 collocation → loss landscape 劇變
#   → SOAP preconditioner 失效 → L_phys 爆漲。
#   SOAP 穩定的 RAR freq 下限 = 1000（EXP-054 驗證）。本 config 用 1000。
#
# Falsifiability gates：
#   KE < 3.0%  → ✅ RAR 把 physics 聚焦在 wake 高 residual 區，超越 random baseline
#   KE 3-6%    → 🟡 同等（physics 不是 cylinder baseline 的瓶頸）
#   KE > 10%   → ❌ RAR 在 cylinder 有害（可能 wake residual ranking 退化 / SOAP 仍受擾動）

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 64
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05

# ===== CEXP-036 變動（vs CEXP-002）=====
physics_collocation_strategy = "rar"   # ← random → rar
rar_update_freq = 1000                  # SOAP 穩定下限（CLAUDE.md EXP-054）
rar_pool_multiplier = 10                # pool = 64 × 10 = 640
rar_exploration_ratio = 0.2            # 20% 隨機點防 mode collapse
# ======================================

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp036-rar"
