# configs/exp_cylinder_025_trunk_geo_only.toml
# CEXP-025 = CEXP-002 + C-only geometry-aware architecture
#
# What:
#   C: use_trunk_geo_context=true — trunk query 從 body geometry memory 取回 query-local context。
#
# Why:
#   與 CEXP-023 (B+C) 拆成單變數 ablation，檢查 query-side geometry memory
#   是否能修正複雜幾何下 trunk 對 boundary/wake 位置的盲點。
#
# Falsifiability:
#   - KE < 10% 且 body/wake 指標不惡化：C-only 有效。
#   - KE 10-30%：部分有效，需與 CEXP-023 / CEXP-024 比較。
#   - KE > 30% 或 ke_pred/ke_ref > 2：query-side geometry memory 不足或造成不良先驗。

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/home/junyi/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

# ===== C-only geometry-aware opt-in（唯一架構變動）=====
use_graph_spatial_encoder = false
graph_k_neighbors = 8
use_trunk_geo_context = true
# ======================================================

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（對齊 CEXP-002）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow / body / slip BC（對齊 CEXP-002）
bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 64
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# Time marching
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer
iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp025-trunk-geo-only"
