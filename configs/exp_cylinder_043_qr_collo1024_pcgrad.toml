# configs/exp_cylinder_043_qr_collo1024_pcgrad.toml
# CEXP-043 = CEXP-002（QR-pivot baseline）+ collo 1024 + PCGrad
#
# 設計目的（對稱實驗）：
#   CEXP-030（QR+collo1024）= KE 610%（ill-posedness：physics over-constrain 推到 spurious 解）
#   CEXP-042（random+collo1024+PCGrad）= KE 174%（PCGrad 對 random base 有壓制效果）
#   本實驗：PCGrad 能否緩解 QR base 的 ill-posedness？
#
#   PCGrad 機制：當 data 與 physics 梯度衝突（cos < 0）時，投影去除衝突分量。
#   若 CEXP-030 的爆漲根因是「physics 把 model 推離真實解、data 梯度試圖拉回」
#   → PCGrad 應偵測到持續負 cos，並壓制 physics 的「偏離」方向。
#
# Falsifiability：
#   KE < 50%（接近 CEXP-002 3.54%）  → PCGrad 成功緩解 ill-posedness，資訊論 sensor 是關鍵
#   KE ≈ 100–300%（接近 CEXP-042 174%）→ PCGrad 部分有效，但 QR 強 data 未必比 random 優（相對差距縮小）
#   KE > 300%（接近 CEXP-030 610%）  → PCGrad 無法緩解 QR+collo 的 ill-posedness（根因在 sensor 配置，非 optimizer）
#
# 三方比較：
#   CEXP-030：QR + collo1024 + NO PCGrad  = KE 610%
#   CEXP-042：random + collo1024 + PCGrad  = KE 174%
#   CEXP-043：QR + collo1024 + PCGrad      = ???（本次）
#
[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

# 空間編碼
fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉

# 時間
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

# 模型容量（與 CEXP-002 相同）
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Physics loss
domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# Inflow BC loss（CEXP-002 相同設定）
bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 64
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# GradNorm（與 CEXP-002/042 相同）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

# PCGrad（本次新增，相對 CEXP-030 的唯一額外變因）
use_pcgrad = true

# Time marching
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

# Optimizer
iterations = 10000
num_physics_points = 1024     # 本次變因 1：64 → 1024（與 CEXP-030 相同）
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp043-qr-collo1024-pcgrad"
