# configs/exp_cylinder_005_bc_body.toml
# What: cylinder K=100 + post-fix + 5-task GradNorm + **B (outlet BC + body 256) + C (body-aware sampling)**
#
# 與 exp_004 差異：
#   bc_body_n_points:        64 → 256        (B: dense body no-slip)
#   bc_outlet_n_points:      0  → 64         (B: x=1 outlet ∂u/∂x≈0)
#   physics_collocation_strategy: "random" → "body_aware"  (C: 30% bias to body)
#
# Hypothesis: model 在 boundary 區域看更多點 + 更強 BC enforce → vortex shedding
#             pattern 開始浮現，wake 振盪 amplitude 接近 DNS。
# Falsifiability: 若 KE rel-err 仍 > 12%（exp_004 同步數），表示 boundary 改善
#                 不夠，需要 architecture-level fix（distance feature → query_decoder）
#                 或更長訓練。

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true   # cylinder 必要：u_std~0.15，黏性項否則被壓掉
use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

# === BC 增強（B）===
bc_loss_weight = 0.1            # 5-task GradNorm 模式下 init weight，動態調
bc_inflow_u = 0.33
bc_n_points = 64                # inflow x=0
bc_body_n_points = 256          # ← B: 64 → 256（dense no-slip）
bc_slip_n_points = 32           # top/bottom slip
bc_outlet_n_points = 64         # ← B: 新增 outlet x=1 ∂u/∂x≈0

t_early_weight = 10.0
t_early_threshold = 0.05

# === Body-aware collocation 採樣（C）===
physics_collocation_strategy = "body_aware"   # ← C: 30% 採樣偏向 body 邊界

# 5-task GradNorm（同 exp_004）
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01, 0.1]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 3000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "mps"

artifacts_dir = "artifacts/deeponet-cfc-cylinder-exp005-bc-body"
