# configs/exp_cylinder_039_sensor_film.toml
# CEXP-039 = CEXP-002 + sensor-conditioned FiLM (B3-a: pure sensor, no geometry)
#
# 設計目的（B3 FiLM）：
#   geometry-as-input 全失敗（CEXP-020/022/023-027）、hard/soft body BC 全失敗
#   （CEXP-037/038 over-energy）。共同根因（Finding #8）：body 區無 sensor 校正。
#   FiLM 改用 sensor hidden state 大域調制 decoder trunk feature，conditioning
#   來自有 supervision 的 sensor → 結構性回避「body 區無校正」。
#   B3-a：純 sensor state（geometry 完全不入），模型靠 sensor 隱式推斷 body。
#
# 變更 vs CEXP-002：
#   use_sensor_film:  (新) → true
#   film_use_geometry:(新) → false
#   bc_body_n_points: 64   → 0     (不用 body soft BC，純測 FiLM)
#
# Falsifiability：KE <10% ✅ / 10-30% 🟡 / >100% ❌
# Ablation：與 CEXP-040（+geometry）對比判斷 geometry 是否有幫助。

[train]
dataset_type = "cylinder"

sensor_jsons = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031.json",
]
sensor_npzs = [
  "data/cylinder_sensors/sensors_qrpivot_K100_cylinder_Re10031_values.npz",
]
arrow_shards = [
  "/Users/latteine/Documents/coding/RealPDEBench/data/realpdebench/cylinder/hf_dataset/numerical/data-00000-of-00092.arrow",
]
re_values = [10031.0]
observed_sensor_channels = ["u", "v"]
sensor_subsample = 20

fourier_harmonics = 16
fourier_embed_dim = 128
use_periodic_domain = false
use_physics_denormalization = true

use_temporal_anchor = true
T_total = 20.0
temporal_anchor_harmonics = 2

d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

domain_length = 1.0
kolmogorov_k_f = 0.0
kolmogorov_A = 0.0

data_loss_weight = 1.0
physics_loss_weight = 0.01
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 1.0
poisson_loss_weight = 0.0

bc_loss_weight = 0.1
bc_inflow_u = 0.33
bc_n_points = 64
bc_body_n_points = 0      # ← 不用 body soft BC，純測 FiLM
bc_slip_n_points = 32

t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"

# ===== CEXP-039 變動 =====
use_sensor_film = true     # ← B3: sensor hidden 經 FiLM 調制 trunk feature
film_use_geometry = false  # ← B3-a: 純 sensor state，不入 geometry
# ==========================

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_init_weights = [1.0, 0.01, 0.01, 0.01]

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_sensor_physics = false
num_sensor_physics_time_samples = 1
sensor_physics_start_step = 1000

checkpoint_period = 500
seed = 42
device = "cuda"

artifacts_dir = "artifacts/cylinder/deeponet-cfc-cylinder-exp039-sensor-film"
