# configs/exp_241_baseline.toml
# What: EXP-241 對照組 baseline — forcing (A, k_f) 全部 hardcoded（沿用既有設定），
#       唯一變更：num_physics_points 64 → 2048，與 EXP-241 _learn_* 變體拉齊 collocation 密度。
#
# Why: EXP-241 系列要回答「PI-CON 能否從 sensor + PDE residual 反推未知 forcing 參數」。
#      _learn_A / _learn_kf / _learn_both 必須跟同樣 collocation budget 的 baseline 比較，
#      否則「學了 forcing 結果變差」可能單純是 collocation 變密改變了 loss landscape。
#
# Hypothesis: collocation 從 64 → 2048（32×）後，KE rel-err 應比 EXP-094 baseline (9.4%)
#             略好或持平；若顯著惡化（>15%）表示 2048 對該 dataset 過度採樣 → 該回退。
#
# Falsifiability:
#   (a) KE 7-12% → collocation 提升合理，可作為 _learn_* 對照基準
#   (b) KE > 15% → over-sampling 干擾，需檢討 RAR pool_multiplier / batch dynamics
#
# 變動點（vs EXP-094 _b3_seed2）：
#   - num_physics_points = 64 → 2048
#   - artifacts_dir 改名
# 其餘完全一致（B3 backbone + 4-task GN + AL）。

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

# Forcing 全已知（control）
learn_forcing_A = false
learn_forcing_k_f = false

iterations = 10000
num_physics_points = 2048   # 32× EXP-094，與 _learn_* 變體拉齊
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0

use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true

checkpoint_period = 500
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp241-baseline"

seed = 2
