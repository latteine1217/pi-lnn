# configs/exp_275_lbfgs_fixed_batch.toml
# What: EXP-275 — L-BFGS fixed-batch 診斷（驗證 EXP-274 phase2 失效的 curvature-history 假設）
# Why: EXP-274 的 phase2 L-BFGS 對 training loss 與 DNS 指標皆無增益。診斷假設：
#        phase2 每個 outer step 重採樣 sensor/collocation（freq=1）→ L-BFGS 的 curvature
#        history (s_k, y_k) 跨不同 batch 累積 → Hessian 近似失效 → L-BFGS 退化成帶雜訊一階法。
#        （與 SOAP+RAR freq≥1000 才穩的失效機制同源。）
#        phase2 逐步 l_data 已證實：5000 步在 5.94e-4~1.08e-2 鋸齒震盪，前/後1000步均 ~2.75e-3，完全無下降。
#
# 嚴格單變因對照（vs EXP-274 = exp_274_al_delay_lbfgs.toml）：唯一改動 =
#   - lbfgs_finetune_fixed_batch: (未設, =False) → true（整個 phase2 只採樣一次、跨 outer step 重用）
#   - artifacts_dir → exp275
#   其餘（al_start_step=10000, freq=500, lbfgs_finetune_steps=5000, max_iter=20, history=10,
#         phase1 全部設定, seed=42, DNS QR-pivot sensor）全與 EXP-274 byte-identical。
#   NOTE: 刻意「不」一起改 max_iter/history，以保單變因。確認 fixed_batch 有效後再另開實驗調這些。
#
# Hypothesis（SCIENTIFIC_HYPOTHESIS_PROTOCOL）:
#   - 預期解決: 固定目標函數 → curvature history (s_k,y_k) 自洽 → L-BFGS 真正二階收斂。
#   - Expected_Change: phase2 l_data 變「單調下降」（vs EXP-274 的鋸齒震盪）。
#   - Falsifiability:
#       (a) 若 l_data 仍鋸齒不降 → curvature 假設錯，失效另有原因（如 y_t 已最優、無可榨空間）。
#       (b) 若 l_data 單調降但 DNS KE/div 退步 → 過擬合固定 collocation（救優化傷泛化）→ phase2 路線不可行。
#       (c) 若 l_data 單調降且 DNS 指標改善 → fixed batch 為正確修法，EXP-274 確為設計錯配。

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
time_marching_warmup_steps = 2000   # fixed-step, 不隨 iterations 變動
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 20000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 500
al_start_step = 10000
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
lbfgs_finetune_steps = 5000
lbfgs_finetune_fixed_batch = true   # EXP-275: 唯一變因 — phase2 固定 batch，curvature history 自洽
lbfgs_max_iter = 20
lbfgs_history_size = 10
checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp275-lbfgs-fixed-batch"
