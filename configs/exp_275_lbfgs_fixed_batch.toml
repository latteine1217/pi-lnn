# configs/exp_274_al_delay_lbfgs.toml
# What: EXP-274 — AL delayed-start + Phase2 L-BFGS finetune（探索性訓練策略）
# Why: 探索兩個訓練策略對 KE/div 的影響：
#        (1) AL dual update 延後到 step >= 10000 才開啟（早期 λ 凍結在 0，僅留 ρ 二次罰），
#            freq 由 100 放寬到 500 — 假設早期讓 data/NS 先收斂、後期才用 λ 線性項收緊 continuity。
#        (2) 主 phase (SOAP 20k) 跑完後，同進程切 L-BFGS 在 eval-mode(y_t) 上 finetune 5000 步
#            (max_iter=20)，λ 凍結 — 假設二階 optimizer 能進一步壓低 residual。
#
# 派生 from EXP-271 (= exp_271_b3_dns_pivot.toml)，唯一改動:
#   - al_update_freq: 100 → 500
#   - al_start_step: 0 → 10000（新 key）
#   - lbfgs_finetune_steps: 0 → 5000（新 key）
#   - lbfgs_max_iter: 20（既有預設，明示）
#   - artifacts_dir → exp274
#
# Hypothesis（SCIENTIFIC_HYPOTHESIS_PROTOCOL）:
#   - 預期解決: 早期 AL λ 線性項過早收緊 continuity 壓抑 data 學習 → 延後開啟讓 KE 先到位。
#   - Expected_Change: phase2 後 div L2 進一步下降；KE rel-err 持平或微幅改善。
#   - Falsifiability: 若 phase2 後 L_data 大幅上升（LBFGS 過度收 cont 犧牲 data）或
#     KE rel-err 退步，則此策略對本問題無益。

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = ["data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy"]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256
data_loss_weight = 1.0
physics_loss_weight = 0.057
continuity_weight = 0.0
poisson_loss_weight = 0.0
t_early_weight = 10.0
t_early_threshold = 0.05
physics_collocation_strategy = "random"
time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
time_marching_warmup_steps = 2000   # fixed-step, 不隨 iterations 變動
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1
iterations = 20000
num_physics_points = 1024
learning_rate = 1e-3
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v", "cont"]
gradnorm_init_weights = [1.0, 0.057, 0.057, 0.01]
gradnorm_min_weight = 0.0
gradnorm_max_weight = 0.0
use_augmented_lagrangian = true
al_constraints = ["cont"]
al_init_lambda = 0.0
al_rho = 0.1
al_update_freq = 500       # EXP-274: 100 → 500（放寬 dual update 頻率）
al_start_step = 10000      # EXP-274: dual update 延後到 step >= 10000；早期 λ 凍結在 0
al_lambda_clip = 10.0
al_ema_momentum = 0.5
al_allow_cont_in_gradnorm = true
lbfgs_finetune_steps = 1000   # EXP-275: fixed-batch 下用較少 outer step（固定目標 + 大 max_iter）
lbfgs_max_iter = 50           # EXP-275: fixed batch 後 line-search 在固定目標上才划算 → 加大
lbfgs_history_size = 20       # EXP-275: 固定目標下加大 curvature history
checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false
artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp275-lbfgs-fixed-batch"
