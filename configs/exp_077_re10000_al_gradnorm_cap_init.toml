# configs/exp_075_re10000_al_gradnorm_capped.toml
# What: EXP-077 — EXP-071 + gradnorm_max_weight cap (0.057, =init weight) — GradNorm immediate freeze; phase transition probe on ns_u/ns_v。
#
# Why: EXP-071 達成 ADR-001 §7 條件 #1（div L2 0.044 < 0.05），但 KE 退步到 14.57%
#      (vs baseline 7.80%)。診斷：GradNorm 把 ns_u/ns_v 收斂在 0.281/0.306（init 0.057
#      的 5×），data 權重相對被壓 → KE 退步。
#      Cap 限制 ns physics weight ≤ 0.20，期望守住 div breakthrough 的同時改善 KE。
#
# Hypothesis: KE rel-err < 12% (改善 EXP-071 14.57% 至少 2pp)；
#             div L2 < 0.10 (仍遠優於 baseline 0.184)；
#             GradNorm w_ns 收斂在 cap 0.20 附近（不再爬到 0.30+）
#
# Falsifiability:
#   - 若 KE > 13% → cap 太高，ns 權重仍主導
#   - 若 div L2 > 0.20 → cap 太低，AL 不夠強
#   - 若 ek_ratio_kf < 0.7 → 高頻 reconstruction 災難
#
# 唯一改動（vs EXP-071）：
#   - gradnorm_max_weight = 0.057  （新加的 code support）
#
# Spec ref: ADR-002 Decision-B (修正版) — `docs/adr/002-al-continuity-post-bugfix-reopen.md`

[train]
sensor_jsons = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100.json",
]
sensor_npzs = [
  "data/kolmogorov_sensors/re10000/sensors_qrpivot_K100_N256_t0-5_si100_dns_values.npz",
]
dns_paths = [
  "data/dns/kolmogorov_dns_fp64_etdrk4_Re10000_N256_T5_dt2p5e4_si100_ds4.npy",
]
re_values = [10000.0]
observed_sensor_channels = ["u", "v"]

# 架構與 EXP-064 / EXP-071 完全一致
fourier_harmonics = 16
fourier_embed_dim = 128
use_temporal_anchor = true
T_total = 5.0
temporal_anchor_harmonics = 2
d_model = 256
d_time = 16
num_spatial_cfc_layers = 1
num_temporal_cfc_layers = 1
num_token_attention_layers = 2
token_attention_heads = 4
num_query_mlp_layers = 1
query_mlp_hidden_dim = 256
output_head_gain = 1.0
operator_rank = 256

# Loss weights
data_loss_weight = 1.0
physics_loss_weight = 0.057
physics_loss_warmup_steps = 0
physics_loss_ramp_steps = 0
continuity_weight = 0.0       # AL 接管 cont
poisson_loss_weight = 0.0

t_early_weight = 10.0
t_early_threshold = 0.05

physics_collocation_strategy = "random"

time_marching = true
time_marching_start = 0.5
time_marching_warmup = 0.3
domain_length = 1.0
kolmogorov_k_f = 2.0
kolmogorov_A = 0.1

iterations = 10000
num_physics_points = 64
learning_rate = 1e-3
weight_decay = 0.0
lr_schedule = "soap"
use_schedule_free = true
soap_betas = [0.9, 0.999]
soap_precondition_frequency = 2
lr_warmup_steps = 2000
soap_use_step_decay = true
lr_decay_steps = 2000
lr_decay_gamma = 0.9
min_learning_rate = 1e-6
max_grad_norm = 1.0

# 3-task GradNorm（cont 移出，AL 接管）— 同 EXP-071
use_gradnorm = true
gradnorm_update_freq = 1000
gradnorm_ema_momentum = 0.9
gradnorm_tasks = ["data", "ns_u", "ns_v"]
gradnorm_init_weights = [1.0, 0.057, 0.057]
gradnorm_max_weight = 0.057    # NEW: cap ns_u, ns_v ≤ 0.20（EXP-077 唯一改動）

# AL-continuity 設定（同 EXP-071）
use_augmented_lagrangian = true
al_init_lambda = 0.0
al_rho = 1.0
al_update_freq = 100
al_lambda_clip = 10.0
al_ema_momentum = 0.5

checkpoint_period = 500
seed = 42
device = "mps"
use_sensor_physics = false

artifacts_dir = "artifacts/kolmogorov/deeponet-cfc-re10000-exp077-al-gradnorm-cap-init"
